[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "game-framework"
version = "0.1.0"
description = "MVC-Framework für Karten- und einfache Brettspiele mit tkinter-GUI (nur Standardbibliothek)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["gameframework*", "games*"]
